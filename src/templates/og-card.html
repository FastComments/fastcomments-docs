<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <!--
      Social share card batch. Rendered by rust/sitegen/src/og_image.rs into a
      headless Chrome via page.set_content(), then each .og-card element is
      captured to PNG.

      set_content() gives the document an about:blank base URL, so EVERY asset
      here has to be inline: the webfont is a base64 data URI, the guide icon is
      a base64 data URI, and the logo is CSS-drawn (mirroring .css-logo in
      src/static/css/styles.css). A relative URL would silently 404 and ship a
      card with a missing glyph or a blank icon slot.

      Colors are hardcoded rather than read from prefers-color-scheme: headless
      Chrome always answers "light", so a media query here would be a silent
      dependency on that never changing.
    -->
    <style>
        @font-face {
            font-family: "Red Hat Display";
            src: url('{{{fontDataUri}}}') format('truetype');
            font-weight: 300 900;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: #0d1117;
        }

        .og-card {
            box-sizing: border-box;
            width: 1200px;
            height: 630px;
            padding: 72px 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            background: #1d2939;
            /* Red Hat Display carries Latin/Cyrillic/Greek; ja/ko/zh/he fall
               through to the system Noto faces behind it. */
            font-family: "Red Hat Display", "Noto Sans", "Noto Sans CJK JP",
                         "Noto Sans Hebrew", -apple-system, BlinkMacSystemFont,
                         "Segoe UI", sans-serif;
            color: #e6edf3;
        }

        /* Accent wash in the corner so the card isn't a flat rectangle. */
        .og-card::after {
            content: "";
            position: absolute;
            top: -220px;
            right: -180px;
            width: 620px;
            height: 620px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.30) 0%, rgba(37, 99, 235, 0) 70%);
        }

        .og-card > * {
            position: relative;
            z-index: 1;
        }

        .og-top {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Mirrors .css-logo in src/static/css/styles.css:116-143, scaled up
           for a 1200x630 canvas and recolored for the dark card. */
        .css-logo i {
            display: block;
            width: 40px;
            height: 11px;
            margin-top: 5px;
            background: #ffffff;
        }

        .css-logo i.t {
            margin-top: 0;
            border-radius: 0 5px 5px 5px;
        }

        .css-logo i.m {
            border-radius: 5px 0 5px 5px;
        }

        .css-logo i.b {
            width: 18px;
            border-radius: 0 5px 5px 5px;
        }

        .og-brand {
            font-size: 34px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .og-kicker {
            margin-left: auto;
            font-size: 24px;
            font-weight: 600;
            color: #8b949e;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .og-body {
            display: flex;
            align-items: center;
            gap: 36px;
        }

        .og-icon {
            flex: 0 0 auto;
            width: 116px;
            height: 116px;
            object-fit: contain;
        }

        .og-title {
            margin: 0;
            font-size: 76px;
            line-height: 1.12;
            font-weight: 800;
            letter-spacing: -0.02em;
            /* Long guide headers wrap; anything past 3 lines is clipped rather
               than allowed to push the layout out of the 630px capture box. */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .og-foot {
            font-size: 28px;
            font-weight: 500;
            color: #8b949e;
        }

        /* Hebrew: mirror the whole layout, not just the text run. */
        .og-card[dir="rtl"] .og-kicker {
            margin-left: 0;
            margin-right: auto;
        }
    </style>
</head>
<body>
{{#each cards}}
<div class="og-card" id="{{elementId}}" lang="{{lang}}" dir="{{dir}}">
    <div class="og-top">
        <div class="css-logo"><i class="t"></i><i class="m"></i><i class="b"></i></div>
        <div class="og-brand">FastComments</div>
        <div class="og-kicker">{{kicker}}</div>
    </div>
    <div class="og-body">
        {{#if iconDataUri}}
        <img class="og-icon" src="{{{iconDataUri}}}" alt=""/>
        {{/if}}
        <h1 class="og-title">{{title}}</h1>
    </div>
    <div class="og-foot">docs.fastcomments.com</div>
</div>
{{/each}}
</body>
</html>
